<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster Walk Again Dubai – Opening Invitation</title>
<meta name="description" content="You're invited to the opening of Aster Walk Again Dubai – Advanced Neuro Robotic Rehabilitation. Friday, 27 November 2026, 4:00 PM, Sheikh Zayed Road.">
<meta property="og:title" content="Aster Walk Again Dubai – Opening Invitation">
<meta property="og:description" content="Friday, 27 November 2026 · 4:00 PM · Sheikh Zayed Road, Dubai">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0f1d3d;--teal:#17bfae;--txt:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#050b22;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  #track{height:1000svh}
  #scene{position:fixed;inset:0;overflow:hidden}
  #scene.shake{animation:shake .45s linear}
  @keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
  #layer{position:absolute;left:0;right:0;top:0;will-change:transform}
  .star{position:absolute;border-radius:50%;background:#fff}
  .cloud{position:absolute;border-radius:50%;background:#fff;filter:blur(18px);opacity:.7}
  .lm{position:absolute;width:100%;max-width:600px;height:58svh;transform:translateX(-50%);-webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.12) 6%,rgba(0,0,0,.4) 14%,rgba(0,0,0,.78) 24%,#000 34%,#000 66%,rgba(0,0,0,.78) 76%,rgba(0,0,0,.4) 86%,rgba(0,0,0,.12) 94%,transparent 100%),linear-gradient(to top,transparent 0%,rgba(0,0,0,.5) 14%,#000 34%,#000 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.12) 6%,rgba(0,0,0,.4) 14%,rgba(0,0,0,.78) 24%,#000 34%,#000 66%,rgba(0,0,0,.78) 76%,rgba(0,0,0,.4) 86%,rgba(0,0,0,.12) 94%,transparent 100%),linear-gradient(to top,transparent 0%,rgba(0,0,0,.5) 14%,#000 34%,#000 100%);mask-composite:intersect}
  .lm svg{width:100%;height:100%;display:block}
  .lm img{width:100%;height:100%;display:block;object-fit:contain;object-position:50% 100%}

  /* text zone (top) – never overlaps the person zone (bottom) */
  #texts{position:absolute;left:0;right:0;top:max(84px,11svh);height:calc(45svh - max(84px,11svh));z-index:5;pointer-events:none}
  .tx{position:absolute;inset:0;padding:0 26px;max-width:540px;margin:0 auto;opacity:0;display:flex;flex-direction:column;justify-content:safe flex-end;text-align:center;color:var(--txt);text-shadow:0 2px 18px rgba(5,11,34,var(--sh,.45))}
  .label{font-size:14px;font-weight:600;color:var(--teal)}
  .name{font-size:clamp(40px,11.5vw,64px);font-weight:700;line-height:1.12;margin-top:2px}
  .head{font-size:clamp(18px,5vw,25px);font-weight:600;margin-top:8px;line-height:1.5}
  .txt{font-size:clamp(14.5px,4vw,17px);font-weight:300;margin-top:8px;line-height:1.85;opacity:.92}
  #t0{text-align:center}
  #t3{top:4svh;bottom:-4svh}
  #chair{transform-origin:50% 75%}
  .brand{letter-spacing:.3em;font-weight:600;font-size:14px;direction:ltr}.brand b{color:var(--teal)}
  #t0 h1{font-size:clamp(36px,10.5vw,62px);line-height:1.2;font-weight:700;margin-top:14px}
  .hint{margin-top:3svh;font-size:14px;opacity:.85}
  .chev{width:13px;height:13px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:10px auto 0;animation:chev 1.4s infinite ease-in-out}
  @keyframes chev{0%,100%{transform:translateY(0) rotate(45deg)}50%{transform:translateY(7px) rotate(45deg)}}

  /* actors (bottom zone) */
  .actor{position:absolute;bottom:17svh;height:30svh;aspect-ratio:160/250;transform:translateX(-50%);z-index:6;pointer-events:none}
  .actor svg{width:100%;height:100%;overflow:visible}
  #person{z-index:8}
  .lines{position:absolute;bottom:25svh;left:0;right:0;height:24svh;z-index:7;pointer-events:none;opacity:0}
  .lines i{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(23,191,174,.9));animation:streak .7s linear infinite}
  @keyframes streak{from{transform:translateX(-60vw)}to{transform:translateX(110vw)}}
  #beam{position:absolute;bottom:30svh;height:40svh;width:90px;transform:translateX(-50%);z-index:7;opacity:0;pointer-events:none;border-radius:45px;background:linear-gradient(180deg,rgba(127,240,227,0),rgba(23,191,174,.55) 45%,rgba(255,255,255,.75) 75%,rgba(23,191,174,0));filter:blur(6px)}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none}
  /* companions who walk with him at the end, each with a different therapy device */
  .comp{position:absolute;bottom:17svh;height:27.5svh;aspect-ratio:160/250;transform:translateX(-50%);z-index:7;opacity:0;pointer-events:none;will-change:transform,opacity}
  .comp svg{width:100%;height:100%;overflow:visible}
  .actor svg,.comp svg{position:absolute;left:0;top:0}
  .side,.frontv,.frontseat{transition:none}
  .eye{transform-box:view-box;animation:blink 4.6s ease-in-out infinite}
  .comp:nth-child(2n) .eye{animation-delay:1.3s}.comp:nth-child(3n) .eye{animation-delay:2.7s}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.06)}}
  #flash.go{animation:flash .6s ease-out}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  .pt{position:absolute;z-index:21;border-radius:50%;pointer-events:none;animation:pt var(--d,.9s) cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes pt{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3) rotate(var(--r,0deg));opacity:0}}
  .ring{position:absolute;z-index:19;border:3px solid var(--teal);border-radius:50%;width:40px;height:40px;transform:translate(-50%,-50%);animation:ring .8s ease-out forwards;pointer-events:none}
  @keyframes ring{to{width:70svh;height:70svh;opacity:0;border-width:1px}}
  .pulse{transform-origin:62px 120px;animation:pul 1.8s ease-out infinite}
  .pulse.b{animation-delay:.6s}.pulse.c{animation-delay:1.2s}
  @keyframes pul{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.3);opacity:0}}

  /* invitation */
  #card{position:absolute;left:50%;top:max(64px,7svh);width:min(calc(100% - 36px),420px);transform:translate(-50%,30px);background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--navy);border-radius:28px;padding:24px 22px 20px;text-align:center;box-shadow:0 30px 80px rgba(15,29,61,.14);opacity:0;pointer-events:none;z-index:9}
  .kicker{font-size:13px;color:var(--teal);font-weight:700}
  #card h2{font-size:clamp(23px,6.5vw,30px);margin:4px 0 8px;line-height:1.3}
  .msg{font-size:14px;line-height:1.65;color:#3a4766}
  .details{margin:14px 0 16px;display:grid;gap:8px}
  @media (max-height:760px){#card .msg{display:none}#card .details{margin:10px 0 12px;gap:6px}.cardlogo{width:min(70%,260px);margin-bottom:6px}}
  .row{display:flex;justify-content:space-between;font-size:14px;gap:12px;background:rgba(15,29,61,.045);border-radius:12px;padding:9px 14px}
  .row span:first-child{color:#7a869f}.row span:last-child{font-weight:600}
  .btns{display:flex;gap:10px}
  .btn{flex:1;display:block;text-decoration:none;font-weight:600;font-size:15px;padding:13px 10px;border-radius:16px;cursor:pointer}
  .btn.primary{background:var(--navy);color:#fff}.btn.ghost{background:rgba(15,29,61,.07);color:var(--navy)}

  #bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;z-index:50;direction:ltr;color:var(--txt)}
  .logo{line-height:0}.logo img{height:26px;width:auto;max-width:56vw;display:block;transition:filter .4s}.logo.light img{filter:brightness(0) invert(1)}
  .cardlogo{width:min(78%,300px);height:auto;display:block;margin:0 auto 18px}
  #lang{font:inherit;font-size:13px;font-weight:600;background:rgba(127,140,170,.18);color:inherit;border:none;border-radius:999px;padding:7px 15px;cursor:pointer;backdrop-filter:blur(6px)}
  #toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--navy);color:#fff;font-size:14px;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #rsvp{position:fixed;inset:0;z-index:70;background:rgba(5,11,34,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .25s}
  #rsvp.open{opacity:1;pointer-events:auto}
  #rsvpForm{position:relative;width:min(100%,400px);background:#fff;color:var(--navy);border-radius:24px;padding:24px 20px 18px;text-align:center;box-shadow:0 30px 80px rgba(5,11,34,.35);transform:translateY(16px);transition:transform .25s}
  #rsvp.open #rsvpForm{transform:none}
  #rsvpForm h3{font-size:22px;margin:4px 0 2px}#rsvpForm .sub{font-size:13px;color:#7a869f;margin-bottom:14px}
  #rsvpForm label{display:block;text-align:start;font-size:13px;color:#56627c;margin-bottom:10px}
  #rsvpForm input{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;color:var(--navy);padding:12px 14px;border:1.5px solid #dfe4ec;border-radius:12px;outline:none;background:#f7f9fc}
  #rsvpForm input:focus{border-color:var(--teal);background:#fff}#rsvpForm input.bad{border-color:#e0645a}
  #rsvpForm .btn{width:100%;border:none;margin-top:6px;font-family:inherit;text-align:center}
  #rsvpForm .err{color:#d0473d;font-size:13px;min-height:18px}#rsvpForm .note{font-size:12.5px;color:#7a869f;margin-top:8px}
  #rsvpForm .x{position:absolute;top:10px;inset-inline-end:12px;background:none;border:none;font-size:26px;color:#9aa4b8;cursor:pointer;line-height:1}
</style>
</head>

const STG=[
 {w:[.035,.2],label:['المرحلة الأولى','Stage one'],name:['الحجز','Confinement'],head:['حين يصبح الكرسي هو العالم كله','When a chair becomes the whole world'],txt:['إصابة، أو سكتة دماغية، أو مرض عصبي… قد يحجز الإنسان عن حركته، لكنه لا يحجز أمله.','An injury, a stroke or a neurological condition can hold back movement, but never hope.']},
 {w:[.2,.355],label:['المرحلة الثانية','Stage two'],name:['المحاولة','The Attempt'],head:['كل محاولة… شجاعة','Every attempt is courage'],txt:['يحاول أن يقف من جديد. التأهيل التقليدي لا يكفي دائماً، لكن الإرادة تبدأ من هنا.','He tries to stand again. Conventional rehab is not always enough, but the will begins here.']},
 {w:[.355,.56],label:['المرحلة الثالثة','Stage three'],name:['الاكتشاف','Discovery'],head:['حين تلتقي علوم الأعصاب بالروبوتات','Where neuroscience meets robotics'],txt:['روبوت يقرأ إشارات الجسم العصبية ويساعده على الحركة من جديد، بإشراف متخصصين.','A robotic suit that reads the body\'s nerve signals and helps it move again, guided by specialists.']},
 {w:[.56,.74],label:['المرحلة الرابعة','Stage four'],name:['النجاح','Success'],head:['خطوة… ثم خطوة… ثم حياة','A step… then another… then life'],txt:['تعود الحركة، وتعود الثقة، ويعود الإنسان إلى حياته.','Movement returns, confidence returns, and life begins again.']},
 {w:[.74,.885],label:['المرحلة الخامسة','Stage five'],name:['الانطلاق','Launch'],head:['وانطلاقتنا… من دبي','And our journey launches in Dubai'],txt:['Walk Again تفتح أبوابها في دبي، لتبدأ رحلات جديدة نحو الحركة.','Walk Again opens its doors in Dubai, where new journeys back to movement begin.']}
];

let lang='ar';
var fitTexts=function(){document.querySelectorAll('#texts .tx').forEach(el=>{const els=[...el.querySelectorAll('*')].filter(e=>e.childNodes.length&&[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()));
  els.forEach(e=>e.style.fontSize='');const base=els.map(e=>parseFloat(getComputedStyle(e).fontSize));
  const need=()=>{const c=el.children,f=c[0],l=c[c.length-1];return l.offsetTop+l.offsetHeight-f.offsetTop+parseFloat(getComputedStyle(f).marginTop||0)};
  let k=1;while(need()>el.clientHeight+1&&k>.55){k-=.05;els.forEach((e,i)=>e.style.fontSize=(base[i]*k)+'px')}})}
// characters always stand below the words: their height is whatever room is left under the text
let AH=0;function fitActors(){const H=innerHeight,tb=document.getElementById('texts').getBoundingClientRect().bottom;
  AH=Math.max(.18*H,Math.min(.30*H,H-.17*H-tb-16));
  document.querySelectorAll('.actor').forEach(e=>e.style.height=AH+'px');document.querySelectorAll('.comp').forEach(e=>e.style.height=(AH*27.5/30)+'px')}
const _fit=fitTexts;fitTexts=function(){_fit();fitActors()};
addEventListener('resize',()=>requestAnimationFrame(fitTexts));
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-ar]').forEach(e=>e.innerHTML=e.dataset[l]);document.getElementById('lang').textContent=l==='ar'?'EN':'عربي'}
document.getElementById('lang').onclick=()=>{setLang(lang==='ar'?'en':'ar');fitTexts()};setLang('en');fitTexts();document.fonts&&document.fonts.ready.then(fitTexts);
// RSVP – answers go to a Google Form (pre-filled link); paste the form's pre-filled link details here
const RSVP_FORM={url:'',name:'',phone:'',email:''};   // e.g. url:'https://docs.google.com/forms/d/e/XXXX/viewform', name:'entry.123'
const rv=$id=>document.getElementById($id);
const openR=o=>{rv('rsvp').classList.toggle('open',o);rv('rsvp').setAttribute('aria-hidden',!o)};
rv('rsvpBtn').addEventListener('click',e=>{e.preventDefault();rv('rsvpGo').style.display='none';rv('rsvpNote').textContent='';rv('rsvpForm').querySelector('button[type=submit]').style.display='';openR(true)});
rv('rsvpX').onclick=()=>openR(false);rv('rsvp').addEventListener('click',e=>{if(e.target.id==='rsvp')openR(false)});
rv('rsvpForm').addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=k=>f[k].value.trim();
  const ok={name:v('name').length>1,phone:/^\+?[\d\s()-]{7,}$/.test(v('phone')),email:/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))};
  Object.keys(ok).forEach(k=>f[k].classList.toggle('bad',!ok[k]));
  if(!ok.name||!ok.phone||!ok.email){rv('rsvpErr').textContent=lang==='ar'?'يرجى تعبئة جميع الحقول بشكل صحيح':'Please fill in all fields correctly';return}
  rv('rsvpErr').textContent='';
  if(!RSVP_FORM.url){rv('rsvpNote').textContent=lang==='ar'?'سيتم تفعيل التأكيد قريبًا':'RSVP will open soon';return}
  const q=new URLSearchParams({usp:'pp_url'});q.set(RSVP_FORM.name,v('name'));q.set(RSVP_FORM.phone,v('phone'));q.set(RSVP_FORM.email,v('email'));
  rv('rsvpGo').href=RSVP_FORM.url+'?'+q.toString();rv('rsvpGo').style.display='block';f.querySelector('button[type=submit]').style.display='none';
  rv('rsvpNote').textContent=lang==='ar'?'اضغط «إرسال التأكيد» ثم «إرسال» في الصفحة التالية':'Tap “Send my RSVP”, then “Submit” on the next page'});

  const u='c'+(++_uid)+'s';

    <g opacity=".78">${armSide(c,u,'class="aB"','','class="aBf"')}${legSide(c,u,'class="lB"','class="lBs"',{thigh:o.thigh||'',shin:o.shin||'',foot:'class="lBft"'})}</g>

}

  const amp=docked?lerp(lerp(lerp(4,26,succ),34,launch),0,stop):stepAmp;
  // natural gait: scroll drives the stride, eased so steps stay smooth on choppy scrolling
  const phiT=(docked?sy/(launch>.5?95:140):st*1.2)*Math.PI*2;

  let kF=lerp(G.kF,86,seat),kB=lerp(G.kB,82,seat);
  let fF=lerp(G.fF,0,seat),fB=lerp(G.fB,0,seat);
  const [tx,ty]=rimTarget(cyc),[aIK,eIK]=armIK(tx,ty);aIKs+=(aIK-aIKs)*.35;eIKs+=(eIK-eIKs)*.35;
  let aF=lerp(G.aF,aIKs,seat),aB=lerp(G.aB,aIKs+3,seat),eF=lerp(G.eF,eIKs,seat),eB=lerp(G.eB,eIKs+2,seat);
  // gripping the armrests, knees pulled in
  aF=lerp(aF,-2,grip);aB=lerp(aB,-5,grip);eF=lerp(eF,-77,grip);eB=lerp(eB,-73,grip);
  hipF=lerp(hipF,8,flyW);hipB=lerp(hipB,16,flyW);kF=lerp(kF,6,flyW);kB=lerp(kB,14,flyW);fF=lerp(fF,22,flyW);fB=lerp(fB,22,flyW);aF=lerp(aF,-172,flyW);aB=lerp(aB,-160,flyW);eF=lerp(eF,0,flyW);eB=lerp(eB,0,flyW);
  hipF=lerp(hipF,-97,brace);hipB=lerp(hipB,-91,brace);kF=lerp(kF,97,brace);kB=lerp(kB,93,brace);fF=lerp(fF,-8,brace);fB=lerp(fB,-8,brace);
  rot('legF',hipF,60,120);rot('legB',hipB,60,120);rot('shinF',kF,60,170);rot('shinB',kB,60,170);rot('footF',fF,61,212);rot('footB',fB,61,212);
  rot('armF',aF,60,60);rot('armB',aB,60,60);rot('foreF',eF,60.5,93);rot('foreB',eB,60.5,93);
  rot('pHead',-G.lean*.6+G.nod+headX,62,48);
  const idle=(1-clamp(kk))*(1-seat)*(1-flyW);
  const bob=G.bob+idle*.7*Math.sin(sec*2.1);
  $('pBody').setAttribute('transform',`translate(0 ${(bob+50*seat).toFixed(2)}) rotate(${(trem+launch*3+tilt+G.lean).toFixed(2)} 60 120)`);
  $('pAll').setAttribute('transform',face<0?'translate(120 0) scale(-1 1)':'');

  if(p>.86){const cb=$('card').getBoundingClientRect(),cbot=cb.bottom-(1-sm(.885,.92,p))*0+0,avail=vh*.97-(cb.top+cb.height)-14;endS=clamp(avail/(AH||30*U),.4,.78)}

  document.querySelectorAll('#person .side, .comp .side').forEach(e=>e.style.opacity=(showFront||showFront0)?0:1);
  document.querySelectorAll('#person .frontv, .comp .frontv').forEach(e=>e.style.opacity=showFront?1:0);
  P.querySelector('.frontseat').style.opacity=showFront0?1:0;
  const onChair=p<T1;
  P.style.transform=`translateX(-50%) ${onChair?rig:''} translateY(${(y+17*U*sm(.885,.92,p)).toFixed(1)}px) scale(${sc.toFixed(3)}) scaleX(${(sx*sx0*(p>=F1&&p<T0?Math.abs(flipX):1)).toFixed(3)})`;P.style.transformOrigin=onChair?'50% 75%':'50% 100%';
  document.querySelectorAll('#person .exo').forEach(e=>e.setAttribute('opacity',docked?1:0));
  P.style.filter=docked?`drop-shadow(0 0 ${(4+14*launch*(1-stop)+8*(1-sm(.5,.53,p))).toFixed(1)}px rgba(23,191,174,.8))`:(p>=T0?`drop-shadow(0 0 ${(6+10*flyW).toFixed(1)}px rgba(127,240,227,.9))`:'none');
  $('lines').style.opacity=(launch*(1-stop)).toFixed(2);$('lines').style.transform=face>0?'scaleX(-1)':'none';
  // keep the words clear while he drops past them
  $('texts').style.opacity=(1-sm(P0-.008,P0+.002,p)*(1-sm(F1+.004,F1+.014,p))).toFixed(2);

  COMPS.forEach((o,i)=>{const el=$('c'+i);const k=sm(.755+i*.012,.795+i*.012,p);const side=o.off<0?-1:1;
    const g2=gait(phiS/(2*Math.PI)+i*.19,kk*(.9+.05*i));
    const q=sel=>el.querySelector(sel),R=(sel,a,cx,cy)=>q(sel).setAttribute('transform',`rotate(${a.toFixed(2)} ${cx} ${cy})`);

    R('.aF',g2.aF,60,60);R('.aB',g2.aB,60,60);R('.aFf',g2.eF,60.5,93);R('.aBf',g2.eB,60.5,93);R('.hd',-g2.lean*.6+g2.nod,62,48);
    q('.body').setAttribute('transform',`translate(0 ${(g2.bob+(1-clamp(kk))*.7*Math.sin(sec*2.1+i)).toFixed(2)}) rotate(${g2.lean.toFixed(2)} 60 120)`);
    q('.all').setAttribute('transform',face<0?'translate(120 0) scale(-1 1)':'');
    const depth=Math.abs(o.off)>20?.9:1;
    el.style.left=(x+o.off*(face<0?-1:1)*0+o.off)+'%';
    el.style.opacity=k.toFixed(3);
    el.style.transform=`translateX(calc(-50% + ${(side*(1-k)*45).toFixed(1)}vw)) translateY(${(17*U*sm(.885,.92,p)-(1-depth)*2*U).toFixed(1)}px) scale(${(lerp(1,endS*30/27.5,sm(.885,.92,p))*Math.min(1,depth)).toFixed(3)}) scaleX(${sx.toFixed(3)})`;el.style.transformOrigin='50% 100%';
    el.style.filter=`drop-shadow(0 0 ${(3+10*launch*(1-stop)).toFixed(1)}px rgba(23,191,174,.55))`});
  // card
  const cp=sm(.885,.92,p);$('card').style.opacity=cp.toFixed(3);$('card').style.transform=`translate(-50%,${((1-cp)*30).toFixed(1)}px)`;$('card').style.pointerEvents=cp>.6?'auto':'none';

  // one-shot effects when crossing forward
  if(lastP<.5&&p>=.5)fx('dock',24);if(lastP<.453&&p>=.453)fx('launch',56);
  if(lastP<.78&&p>=.78)fx('launch',x);
  if(lastP<.9&&p>=.9)fx('party',x);
  lastP=p;
  requestAnimationFrame(frame);
}
